{% load static %}
{% load i18n %}
<!doctype html>
<html {% get_current_language as LANGUAGE_CODE %} lang="{{ LANGUAGE_CODE }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">

    <link rel="stylesheet" href="{% static 'portfolio/custom.css' %}">

    <link href="https://fonts.googleapis.com/css?family=Lato&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'portfolio/logo.png' %}">

    <title>{% trans "Jan Shalygin" %}</title>
  </head>
  <body>
    <nav id="topNav" class="navbar navbar-expand-md navbar-light">
        <div class="container d-flex justify-content-between align-items-center">
            <!-- Логотип и название -->
            <a class="navbar-brand" href="{% url 'home' %}">
                <img src="{% static 'portfolio/logo.png' %}" width="30" height="30" class="d-inline-block align-top" alt="{% trans "Iv's Logo" %}">
                <span><b>{% trans "Jan Shalygin" %}</b></span>
            </a>

            <!-- Выбор языка и ссылки -->
            <div class="d-flex align-items-center">
                <!-- Форма выбора языка -->
                <form action="{% url 'set_language' %}" method="post" class="me-3 d-flex align-items-center"> <!-- me-3 добавляет отступ справа -->
                    {% csrf_token %}
                    <select name="language" class="form-select form-select-sm d-inline-block w-auto me-2">
                    <option value="en" {% if LANGUAGE_CODE == "en" %}selected{% endif %}>English</option>
                    <option value="be" {% if LANGUAGE_CODE == "be" %}selected{% endif %}>Беларуская</option>
                    <option value="pl" {% if LANGUAGE_CODE == "pl" %}selected{% endif %}>Polski</option>
                    <option value="ru" {% if LANGUAGE_CODE == "ru" %}selected{% endif %}>Русский</option>
                    </select>
                    <input type="submit" value="{% trans 'Change Language' %}" class="btn btn-secondary btn-sm">
                </form>

                <!-- Панель ссылок -->
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 d-flex align-items-center">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="https://drive.google.com/file/d/10JX4D2dx1tffM94wqTEWOP3y0LV_2Wv2/view?usp=drive_link" target="_blank">
                            {% trans "My Resume" %}
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://www.linkedin.com/in/ivan-shalygin-264074227/" target="_blank">{% trans "LinkedIn" %}</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://www.facebook.com/iv.shalygin" target="_blank">{% trans "Facebook" %}</a>
                        </li>
                        <li class="nav-item">
                            <a role="button" href="{% url 'blog:all_blogs' %}" class="btn btn-primary">{% trans "Blog" %}</a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Кнопка для мобильного меню -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="{% trans 'Toggle navigation' %}">
            <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>



  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1/dist/es-module-shims.min.js" crossorigin="anonymous"></script>
  <script type="importmap">
  {
    "imports": {
      "@popperjs/core": "https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js",
      "bootstrap": "https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.esm.min.js"
    }
  }
  </script>
  <script type="module">
    import * as bootstrap from 'bootstrap'

    new bootstrap.Popover(document.getElementById('popoverButton'))
  </script>
  </body>
</html>
